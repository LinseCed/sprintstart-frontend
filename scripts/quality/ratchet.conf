# sprintstart-frontend settings for ratchet.sh and the ai-guard hooks (AI_RULES.md).
# Paths are git pathspecs relative to the repository root.

SOURCE_PATHS=('src')
TEST_PATHS=('tests')

# R4: any way of silencing a finding.
SUPPRESSION_RE='eslint-disable|@ts-(ignore|expect-error|nocheck)'

# R6: tests switched off or narrowed to one.
SKIP_RE='\b(it|test|describe)\.(skip|only|todo)\(|\b[xf](it|describe)\('

# R7: checked by review in this repository (see the repo section of AI_RULES.md).
RAWID_RE=''
RAWID_PATHS=()

# R3: file length. The Keycloak theme is ejected Keycloakify code and excluded.
FILE_LIMIT=400
SIZE_PATHS=(':(glob)src/**/*.ts' ':(glob)src/**/*.tsx' ':(exclude)src/keycloak-theme/**')

# R3/R4: lint baselines, which may only shrink.
LINT_BASELINES=('eslint-suppressions.json' '.dependency-cruiser-known-violations.json')

# R5: configuration that decides what is checked.
PROTECTED=('eslint.config.js' ':(glob)tsconfig*.json' '.prettierrc' '.prettierrc.json' '.prettierignore'
    '.dependency-cruiser.cjs' 'knip.json' 'stryker.config.json' 'playwright.config.ts'
    '.github/workflows' 'scripts/quality' 'scripts/ai-guard' '.claude/settings.json' 'AI_RULES.md')

# R17: comments that narrate history (warning only).
HISTORY_RE='(//|/?\*).*\b([Uu]sed to|[Nn]o longer|[Pp]reviously|the whole change|this change|after the fix|before the fix)\b'

# R25: dependencies logic reaches for instead of taking (pass a clock or an id factory in).
HIDDEN_DEPS_RE='\bDate\.now\(\)|new Date\(\)|Math\.random\(\)|crypto\.randomUUID\(\)'

# R25: coverage (scripts/quality/coverage-gate.sh) — `npm run coverage` writes the report.
COVERAGE_REPORT='coverage/cobertura-coverage.xml'
COVERAGE_FORMAT='cobertura'
COVERAGE_SRC_ROOTS=''
DIFF_COVERAGE_MIN=80

# R26: duplication and dead code (scripts/quality/metrics.sh). Dead code is knip's unused files,
# exports, types and members (scripts/quality/knip-count.mjs).
DUPLICATION_PATHS=('src')
DUPLICATION_FORMATS='typescript,tsx'
DUPLICATION_IGNORE='**/keycloak-theme/**'
DEADCODE_CMD='node scripts/quality/knip-count.mjs'

# R12: contract copies this repository consumes.
CONTRACT_COPIES=('contracts/buddy-stream-events.schema.json|sprintstart-backend|contracts/buddy-stream-events.schema.json'
    'contracts/examples/buddy-stream|sprintstart-backend|contracts/examples/buddy-stream')

# R25: mutation testing (scripts/quality/mutation.sh) with Stryker on the files a branch changed.
MUTATION_FILES=(':(glob)src/**/*.ts' ':(glob)src/**/*.tsx' ':(exclude)src/keycloak-theme/**')
MUTATION_MIN=60
MUTATION_REPORT='reports/mutation/mutation.json'

run_mutation() {
    rm -f "$MUTATION_REPORT"
    npx stryker run --mutate "$(printf '%s\n' "$@" | paste -sd, -)"
}

# Killed and timed-out mutants count as detected; survivors and uncovered mutants count against.
mutation_counts() {
    [ -f "$MUTATION_REPORT" ] || { echo "0 0"; return; }
    node -e '
        const report = require(require("path").resolve(process.argv[1]));
        const mutants = Object.values(report.files).flatMap((file) => file.mutants);
        const counted = mutants.filter((m) => ["Killed", "Timeout", "Survived", "NoCoverage"].includes(m.status));
        const detected = counted.filter((m) => m.status === "Killed" || m.status === "Timeout");
        console.log(detected.length, counted.length);
    ' "$MUTATION_REPORT"
}
